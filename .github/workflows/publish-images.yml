name: Publish production images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-production-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/alex-jienexa/foundry-marches-api
            dockerfile: src/backend/Dockerfile
          - name: bot
            image: ghcr.io/alex-jienexa/foundry-marches-bot
            dockerfile: src/backend/Dockerfile.bot
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deployment-bundle:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble source-free deployment bundle
        run: |
          mkdir -p deployment-bundle/docs/database/migrations deployment-bundle/docker/init deployment-bundle/scripts deployment-bundle/docs/operations
          cp compose.yaml compose.production.yaml .env.prod.example deployment-bundle/
          cp docs/database/schema.sql deployment-bundle/docs/database/
          cp docs/database/migrations/*.sql deployment-bundle/docs/database/migrations/
          cp docker/init/20-bootstrap.sql deployment-bundle/docker/init/
          cp scripts/backup-postgres.sh deployment-bundle/scripts/
          cp docs/operations/production.md deployment-bundle/docs/operations/
          tar -czf foundry-marches-deployment-bundle.tar.gz -C deployment-bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-marches-deployment-bundle-${{ github.sha }}
          path: foundry-marches-deployment-bundle.tar.gz
          if-no-files-found: error
          retention-days: 90
