services:
  postgres:
    init: true
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_wal_size=512MB
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  api:
    image: ghcr.io/alex-jienexa/foundry-marches-api:${FOUNDRY_MARCHES_VERSION:?Set FOUNDRY_MARCHES_VERSION in .env.prod}
    build: !reset null
    pull_policy: always
    environment:
      DISCORD_ADMIN_USER_IDS: ${DISCORD_ADMIN_USER_IDS:?Set DISCORD_ADMIN_USER_IDS in .env.prod}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
          pids: 256

  discord-bot:
    image: ghcr.io/alex-jienexa/foundry-marches-bot:${FOUNDRY_MARCHES_VERSION:?Set FOUNDRY_MARCHES_VERSION in .env.prod}
    build: !reset null
    pull_policy: always
    environment:
      DISCORD_ADMIN_CHANNEL_ID: ${DISCORD_ADMIN_CHANNEL_ID:?Set DISCORD_ADMIN_CHANNEL_ID in .env.prod}
      DISCORD_CAMPAIGN_ROLE_ID: ${DISCORD_CAMPAIGN_ROLE_ID:?Set DISCORD_CAMPAIGN_ROLE_ID in .env.prod}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
          pids: 128
